name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========== СБОРКА ДЛЯ LINUX ==========
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y cmake build-essential

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build project
      run: cmake --build build

    - name: Run tests
      run: ./build/test_hamburger

    - name: Create deb package
      run: |
        cd build
        cpack -G DEB

    - name: Upload deb as artifact
      uses: actions/upload-artifact@v4
      with:
        name: rk2-builder-linux
        path: build/*.deb

    - name: Create Release and upload deb
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== СБОРКА ДЛЯ WINDOWS ==========
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        refreshenv

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build project
      run: cmake --build build --config Release

    - name: Run tests
      run: ./build/Release/test_hamburger.exe

    - name: Create Windows installer (NSIS)
      run: |
        cd build
        cpack -G NSIS

    - name: Upload Windows installer as artifact
      uses: actions/upload-artifact@v4
      with:
        name: rk2-builder-windows
        path: build/*.exe

    - name: Create Release and upload exe
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
